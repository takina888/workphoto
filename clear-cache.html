<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142f43"><title>WORK PHOTO 更新</title>
<style>html,body{min-height:100%;margin:0;background:#f3f6f7;color:#142f43;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,460px);padding:28px;border:1px solid #dce3e7;border-radius:18px;background:#fff;text-align:center;box-sizing:border-box}h1{font-size:24px}p{font-size:16px;line-height:1.7}.spinner{width:42px;height:42px;margin:22px auto;border:5px solid #dce3e7;border-top-color:#315f7a;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}button{min-height:48px;padding:10px 18px;border:0;border-radius:10px;background:#142f43;color:#fff;font-size:16px;font-weight:700}</style></head>
<body><main><section class="card"><h1>最新版へ更新しています</h1><div class="spinner" aria-hidden="true"></div><p id="status">古い表示キャッシュを削除しています。</p><button id="retry" type="button" hidden>もう一度実行</button></section></main>
<script>
(async()=>{const status=document.getElementById('status'),retry=document.getElementById('retry');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(name=>name.startsWith('work-photo-')).map(name=>caches.delete(name)))}status.textContent='削除しました。最新版を開きます。';const next=new URL('./',location.href);next.searchParams.set('cache-reset',Date.now());setTimeout(()=>location.replace(next.href),450)}catch(error){console.error(error);status.textContent='自動更新できませんでした。もう一度実行してください。';retry.hidden=false;retry.onclick=()=>location.reload()}})();
</script></body></html>
