<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142f43">
  <title>撮影・編集を開いています</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f6f7;color:#142f43}
    *{box-sizing:border-box}body{margin:0}.recovery{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);padding:26px 22px;border:1px solid #d7e2e8;border-radius:16px;background:#fff;text-align:center}.spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #d7e2e8;border-top-color:#315f7a;border-radius:50%;animation:spin .8s linear infinite}h1{margin:0 0 8px;font-size:21px}p{margin:0;color:#5d7080;font-size:15px;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="recovery"><section class="card" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h1>最新版を準備しています</h1><p>写真データは消さず、古い画面キャッシュだけを解除します。</p></section></main>
  <script>
    (()=>{
      'use strict';
      const BUILD='20260802-v18-color-r1';
      const RECOVERY_KEY='workphoto.lastRecoveryBuild';
      const target=new URL('./recovery-r1/index.html',location.href);
      for(const [key,value] of new URLSearchParams(location.search)){
        if(key!=='cache-reset'&&key!=='recovery')target.searchParams.append(key,value);
      }
      target.searchParams.set('build',BUILD);
      target.hash=location.hash;
      const cleanup=async()=>{
        if('serviceWorker'in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.allSettled(registrations.map(registration=>registration.unregister()));
        }
        if('caches'in window){
          const names=await caches.keys();
          await Promise.allSettled(names.filter(name=>name.startsWith('work-photo-')||name.startsWith('work-photo-editor-')).map(name=>caches.delete(name)));
        }
      };
      if(navigator.onLine===false){location.replace(target.href);return}
      const forceReset=new URLSearchParams(location.search).has('cache-reset');
      let alreadyRecovered=false;try{alreadyRecovered=localStorage.getItem(RECOVERY_KEY)===BUILD}catch(_){}
      if(alreadyRecovered&&!forceReset){location.replace(target.href);return}
      Promise.race([cleanup(),new Promise(resolve=>setTimeout(resolve,900))]).finally(()=>{try{localStorage.setItem(RECOVERY_KEY,BUILD)}catch(_){}location.replace(target.href)});
    })();
  </script>
</body>
</html>
